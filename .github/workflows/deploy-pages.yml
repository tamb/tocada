name: Deploy demo to GitHub Pages

# Pushes gh-pages/dist to the gh-pages branch. Requires:
# Settings → Pages → Source "Deploy from a branch" → gh-pages / (root).
# If you use "GitHub Actions" as the Pages source instead, replace this workflow
# with upload-pages-artifact + deploy-pages (artifact does not update the branch).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install and build library
        run: |
          bun install
          bun run build

      - name: Install and build demo
        working-directory: gh-pages
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Verify site output
        run: test -f gh-pages/dist/index.html

      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages/dist
          force_orphan: true
